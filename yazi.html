<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog | Yangın Uzmanı Raporu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="canonical" href="https://www.yanginuzmaniraporu.com/yazi.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Yangın Uzmanı Raporu">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="Blog | Yangın Uzmanı Raporu">
  <meta name="description" content="Yangın Güvenlik Uzmanlığı, yönetmelik, kademeler ve eğitim hakkında yazı.">
  <meta property="og:description" content="Yangın Güvenlik Uzmanlığı, yönetmelik, kademeler ve eğitim hakkında yazı.">
  <meta property="og:url" content="https://www.yanginuzmaniraporu.com/yazi.html">
  <meta property="og:image" content="https://www.yanginuzmaniraporu.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <div class="crumbs"><a href="index.html">Ana Sayfa</a> / <a href="blog.html">Blog</a></div>
    <h1 id="detail-title"></h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <article class="article">
      <div class="meta" id="detail-meta"></div>
      <div id="detail-content"></div>

      <div id="tartisma">
        <hr style="border:0;border-top:1px solid var(--line);margin:48px 0 32px">
        <h2 style="margin-top:0">Yorumlar</h2>
        <div id="discussion"></div>
      </div>

      <form data-form="Blog - Yazı Hakkında Soru" class="card" style="margin-top:40px">
        <h3>Bu yazıyla ilgili sorunuz mu var?</h3>
        <div class="row">
          <div><label for="q-ad">Ad Soyad *</label><input id="q-ad" name="Ad" required></div>
          <div><label for="q-mail">E-posta *</label><input id="q-mail" name="E-posta" type="email" required></div>
        </div>
        <label for="q-mesaj">Sorunuz *</label><textarea id="q-mesaj" name="Soru" required></textarea>
        <label class="check"><input type="checkbox" required> Kişisel verilerimin sorumun yanıtlanması amacıyla işlenmesine ilişkin <a href="kvkk.html" target="_blank">KVKK aydınlatma metnini</a> okudum.</label>
        <button class="btn btn-primary" type="submit" style="margin-top:8px">Gönder</button>
        <p class="form-status" style="margin-top:12px;color:var(--muted)"></p>
      </form>

      <p style="margin-top:40px"><a href="blog.html">← Tüm yazılar</a></p>
    </article>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="data/blog.js"></script>
<script src="assets/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () =>
    renderDetail({ data: window.BLOG, backLink: "blog.html", backLabel: "Bloga dönün", discussion: true }));
</script>
</body>
</html>
